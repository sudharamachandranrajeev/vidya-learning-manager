name: vidya
description: "Vidya - learning and knowledge management: programs, courses, skills, portfolio, notes, progress metrics and achievements (Linux, Windows, Android). Part of Brahma."
publish_to: 'none'
version: 0.4.0+7

environment:
  sdk: ^3.13.5

dependencies:
  # Shared core of the Brahma apps. pubspec_overrides.yaml points it at a
  # local checkout during development.
  brahma_core:
    git:
      url: https://github.com/sudharamachandranrajeev/brahma-life-suite.git
      path: core
  # Shared motion and components (the kit), painted in moss and clay through
  # a KitPalette. A local pubspec_overrides.yaml can point it at a checkout.
  ui_kit:
    git:
      url: https://github.com/sudharamachandranrajeev/pariksha-interview-kit.git
      path: packages/ui_kit
      ref: main
  # The spoken interviewer shared with Udyoga: Kokoro voice, Moonshine
  # transcripts, probes, personas, verified-quote scoring and the camera
  # setup check. Speech models are downloaded only when the learner asks.
  # A local pubspec_overrides.yaml can point it at a checkout.
  interview_engine:
    git:
      url: https://github.com/sudharamachandranrajeev/pariksha-interview-kit.git
      path: packages/interview_engine
      ref: main
  drift: ^2.35.2
  # libmpv is opened with dlopen only when a take is played (lib/ui/mpv_loader.dart).
  ffi: ^2.2.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  # Free resource search: the catalogues' JSON APIs.
  http: ^1.6.0
  intl: ^0.20.3
  # Opt-in video takes (J7): playback of the picture with the round's own
  # audio. media_kit (MIT) on Linux and Windows, over libmpv: Linux needs
  # the system's libmpv (libmpv-dev to build, libmpv2 / mpv to run);
  # Windows gets its own copy from media_kit_libs_windows_video. On Android
  # video_player (BSD-3-Clause) shows the picture and audioplayers (MIT)
  # plays the paired audio. Nothing streams: only files on this device.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_video: ^1.0.11
  video_player: ^2.11.1
  audioplayers: ^6.8.1
  # Where the speech models and the round's short-lived recordings live.
  path_provider: ^2.1.6
  timezone: ^0.11.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  # Inter for reading (built for screens, sharp at small sizes); Plus Jakarta
  # Sans for headings. Both SIL OFL 1.1, bundled so no font is fetched.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Bundle SQLite3MultipleCiphers instead of plain SQLite so the local database
# is encrypted at rest on every platform (see doc/hook.md in package:sqlite3).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
